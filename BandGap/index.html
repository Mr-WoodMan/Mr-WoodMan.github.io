<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>大学生の化学 : バンドギャップの解説
  </title>
  <link rel="stylesheet" type="text/css" href="main.css">
</head>
<html>

<body>

      <div id="upper_Header">
    <h1>大学生の化学 : バンドギャップの解説</h1>
  </div>
  <header class="header_box">
    <nav>
      <a id = "nav_Home" href="../index.html"> ホーム </a>
    </nav>
  </header>

  <div class="energy-demo">
    <h3>エネルギー準位のシミュレーター</h3>
    <p>スライダーを動かして、準位の長さとエネルギー差を変えてみよう。</p>

    <div class="energy-chart">
      <svg viewBox="0 0 360 240" role="img" aria-label="2本のエネルギー準位を示す図">
        <defs>
          <marker id="energy-arrow" markerWidth="7" markerHeight="7" refX="4" refY="3" orient="auto-start-reverse">
            <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" />
          </marker>
        </defs>

        <!-- エネルギー軸 -->
        <line x1="45" y1="210" x2="45" y2="20" stroke="currentColor" stroke-width="1.5"
          marker-end="url(#energy-arrow)" />
        <text x="15" y="120" font-size="12" fill="currentColor" transform="rotate(-90 15 120)"
          text-anchor="middle">Energy</text>

        <!-- エネルギー準位 -->
        <line class="level level-high" x1="100" y1="80" x2="280" y2="80" stroke="#0D9488" stroke-width="3" />
        <line class="level level-low" x1="100" y1="160" x2="280" y2="160" stroke="#D97706" stroke-width="3" />

        <text class="label-high" x="100" y="65" font-size="12" fill="#0D9488">E₂</text>
        <text class="label-low" x="100" y="180" font-size="12" fill="#D97706">E₁</text>

        <!-- 準位間の差 -->
        <line class="gap-line" x1="310" y1="80" x2="310" y2="160" stroke="currentColor" stroke-width="1.5"
          marker-start="url(#energy-arrow)" marker-end="url(#energy-arrow)" />
        <text class="gap-label" x="320" y="124" font-size="12" fill="currentColor">ΔE</text>
      </svg>
    </div>

    <div class="energy-control">
      <label>
        準位の線の長さ：
        <output class="length-value">180</output> px
      </label>
      <input class="length-slider" type="range" min="60" max="220" step="10" value="180" />
    </div>

    <div class="energy-control">
      <label>
        エネルギー準位の間隔：
        <output class="gap-value">80</output> px
      </label>
      <input class="gap-slider" type="range" min="30" max="140" step="10" value="80" />
    </div>

    <p class="energy-caption">
      現在の間隔：80 px（図上の距離）
    </p>
  </div>

  <script src="main.js"></script>


</body>

</html>
